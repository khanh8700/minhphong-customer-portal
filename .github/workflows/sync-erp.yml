name: ERP Data Sync Cron

on:
  schedule:
    # Chạy mỗi 60 phút
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Chạy Full Sync (Đồng bộ lại toàn bộ từ đầu)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ERP_SUPABASE_URL: ${{ secrets.ERP_SUPABASE_URL }}
          ERP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ERP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            npx tsx scripts/sync.ts --full
          else
            npx tsx scripts/sync.ts
          fi
