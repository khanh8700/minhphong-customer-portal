name: Database Migrations

# Quy trình deploy migration:
#
#   1. Dev code với local DB → tạo file migration mới trong supabase/migrations/
#   2. Push lên nhánh `main` (hoặc tạo PR merge vào `main`)
#   3. Workflow tự động chạy validate file migration.
#   4. Deploy lên Production:
#      - Tự động chạy khi có code mới ở nhánh `main`
#      - (HOẶC) Chạy thủ công từ tab Actions (workflow_dispatch)
#   5. GitHub Environment 'production' sẽ yêu cầu bạn vào Approve (Required Reviewers)
#   6. Sau khi Approve, job `deploy-production` apply file migration lên Production DB
#   7. Vercel tự deploy phần Code lên web.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/database/validate-migrations.mjs'
      - '.github/workflows/db-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "DEPLOY" để xác nhận (phòng click nhầm)'
        required: true
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Chặn chạy song song
concurrency:
  group: db-migrations-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Validate — chạy trên mọi PR hoặc lúc chạy thủ công
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run migration linter
        run: node scripts/database/validate-migrations.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      - name: Dry-run migrations trên Postgres container
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_PASSWORD=postgres \
            -p 54322:5432 \
            postgres:15
          for i in {1..30}; do
            if docker exec pg-test pg_isready -U postgres > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for f in supabase/migrations/*.sql; do
            echo "→ Applying $f"
            docker exec -i pg-test psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          docker stop pg-test
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy → Production
  # Trigger: Tự động khi code merge vào main HOẶC thủ công qua dispatch
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      - name: Link to Production project
        run: supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Repair orphaned remote migrations (Production)
        run: |
          PROJECT_REF="${{ secrets.PROD_SUPABASE_PROJECT_REF }}"
          LOCAL_VERSIONS=$(ls supabase/migrations/*.sql 2>/dev/null | grep -oE '[0-9]{14}' | sort | xargs)
          echo "Local versions: $LOCAL_VERSIONS"
          ORPHANED=$(node -e "
            const https = require('https');
            https.get({
              hostname: 'api.supabase.com',
              path: '/v1/projects/${PROJECT_REF}/database/migrations',
              headers: { 'Authorization': 'Bearer ${SUPABASE_ACCESS_TOKEN}' }
            }, r => {
              let d = '';
              r.on('data', c => d += c);
              r.on('end', () => {
                const migs = JSON.parse(d);
                if (!Array.isArray(migs)) { process.exit(0); }
                const local = '${LOCAL_VERSIONS}'.trim().split(/\s+/).filter(Boolean);
                const orphaned = migs
                  .filter(m => !local.includes(m.version))
                  .map(m => m.version);
                if (orphaned.length > 0) process.stdout.write(orphaned.join(' '));
              });
            });
          " 2>/dev/null)

          if [ -n "$ORPHANED" ]; then
            echo "Found $(echo $ORPHANED | wc -w) orphaned remote migrations to repair..."
            supabase migration repair --status reverted $ORPHANED
            echo "✅ Migration history aligned."
          else
            echo "✅ No orphaned migrations. Remote and local are in sync."
          fi

      - name: Show diff sẽ apply
        id: diff
        run: |
          echo "### Migration sẽ apply lên Production" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase migration list 2>&1 | tee migration-list-before.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push migration lên Production
        run: supabase db push --include-all

      - name: Verify đồng bộ
        run: |
          echo "### Migration list sau khi push" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase migration list 2>&1 | tee migration-list-after.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.run_id }}
          path: |
            migration-list-before.txt
            migration-list-after.txt
          retention-days: 90
